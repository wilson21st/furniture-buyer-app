{% extends "base.html" %}
{% block title %}Log in · Furniture Buyer{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" action="/login">
    <p>
      <label>User ID<br>
        <input name="user_id" value="u001" autocomplete="username" required>
      </label>
    </p>
    <p>
      <label>Password<br>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
    </p>
    <button type="submit">Log in</button>
  </form>
  <p><small>Demo user: <code>u001</code> / <code>demo1234</code></small></p>
{% endblock %}
