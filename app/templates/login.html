{% extends "base.html" %}
{% block title %}Log in · Furnish{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="sub">Welcome back — sign in to shop and see your orders.</p>
      <form method="post" action="/login">
        <div class="field">
          <label for="user_id">User ID</label>
          <input class="input" id="user_id" name="user_id" value="u001"
                 autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
      <p class="hint">Demo account — <code>u001</code> / <code>demo1234</code></p>
    </div>
  </div>
{% endblock %}
