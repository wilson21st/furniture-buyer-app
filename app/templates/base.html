<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Furniture Buyer{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: .5rem; }
    nav .spacer { flex: 1; }
    .flash { padding: .6rem 1rem; border-radius: 6px; margin: 1rem 0; }
    .flash.info { background: #e7f5ec; }
    .flash.error { background: #fdecea; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #e2e2e2; border-radius: 8px; padding: 1rem; }
    .price { font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #eee; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <nav>
    <a href="/"><strong>🛋️ Furniture Buyer</strong></a>
    <a href="/orders">My orders</a>
    <a href="/chat">Assistant</a>
    <span class="spacer"></span>
    {% if user %}
      <span>{{ user.name }} · ${{ "%.2f"|format(balance or 0) }}</span>
      <form method="post" action="/logout" style="display:inline">
        <button type="submit">Log out</button>
      </form>
    {% else %}
      <a href="/login">Log in</a>
    {% endif %}
  </nav>

  {% if flash %}
    <div class="flash {{ flash.level }}">{{ flash.message }}</div>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
