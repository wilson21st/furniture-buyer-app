name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Dependency vulnerability audit
        run: uv run pip-audit
        continue-on-error: true

      - name: Static security scan (bandit)
        run: uv run bandit -q -r app
        continue-on-error: true

      - name: Tests + hard coverage gate
        # The default addopts exclude e2e/live and enforce --cov-fail-under=95;
        # this job fails if coverage regresses below the gate.
        run: uv run pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium
      - name: Run e2e showcase flow
        run: uv run pytest -m e2e --no-cov
