# Fly.io deployment config. Rename `app` to something globally unique before first
# deploy (or let `fly launch` set it). Secrets are set with `fly secrets set`, not here.
app = "furniture-buyer-app"
primary_region = "syd"   # Sydney — closest to the UNSW event

[build]

[env]
  DATABASE_URL = "sqlite:////data/app.db"
  USE_REAL_API = "false"    # flip to "true" after setting FURNITURE_API_KEY as a secret

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

# Persistent disk so the SQLite database survives restarts/redeploys.
[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
